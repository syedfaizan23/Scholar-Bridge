# ScholarBridge — Docker Compose (SQLite, single-container)
#
# Usage:
#   docker compose up --build
#   docker compose exec backend python manage.py seed_scholarships
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: scholarbridge-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
    volumes:
      - sqlite_data:/app/db
      - media_data:/app/media
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/scholarships/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  sqlite_data:
  media_data:
